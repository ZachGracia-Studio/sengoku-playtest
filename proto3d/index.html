<body>
<div id="note">3D look test v3 · drag to look around · tap the ground to send the scout · pinch to zoom</div>
<div id="ui">

</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

THREE.ColorManagement.enabled = false;
const MAP = 48, HALF = MAP / 2;
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
const DPR = Math.min(devicePixelRatio, 2);
renderer.setPixelRatio(DPR);
document.body.prepend(renderer.domElement);

// ---------- terrain height: a flat valley floor, hills rising to the edges, a river ----------
function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) { const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);

function height(x, z) {

  let h = valley * (fbm(x * .11 + 3, z * .11 + 7) * 7.5 + 1.2) + fbm(x * .3, z * .3) * .35;
  const d = Math.abs(x - riverX(z)); h -= (1 - THREE.MathUtils.smoothstep(d, .6, 2.4)) * (h + .55);
  return h;
}

const scene = new THREE.Scene();
const sun = new THREE.DirectionalLight(0xffffff, 1.25 * Math.PI); sun.position.set(-20, 30, 10); scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff, .62 * Math.PI));

{ // terrain
  const g = new THREE.PlaneGeometry(MAP + 12, MAP + 12, 140, 140); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position, col = [];
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i), h = height(x, z); p.setY(i, h);
    const c = h < -.2 ? .55 : h > 3.5 ? .7 - Math.min(.25, (h - 3.5) * .05) : .9 - fbm(x * .5, z * .5) * .12; col.push(c, c * .98, c * .93); }
  g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3)); g.computeVertexNormals();
  scene.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true })));
  const w = new THREE.Mesh(new THREE.PlaneGeometry(MAP + 12, MAP + 12), new THREE.MeshLambertMaterial({ color: 0xc9c6bf }));
  w.rotation.x = -Math.PI / 2; w.position.y = -.32; scene.add(w);
}
{ // pines, instanced: trunk + three stacked tiers, darker than the ground
  const tiers = new THREE.ConeGeometry(.9, 1.6, 7); const mat = new THREE.MeshLambertMaterial({ color: 0x3a3a3a });
  const N = 260, inst = new THREE.InstancedMesh(tiers, mat, N * 3), m = new THREE.Matrix4(); let k = 0;
  for (let i = 0; i < N * 6 && k < N * 3; i++) { const x = (hash(i, 1) - .5) * MAP, z = (hash(i, 2) - .5) * MAP, h = height(x, z);
    if (Math.hypot(x, z) < 10.5 || h < 0 || Math.abs(x - riverX(z)) < 2.5) continue; if (fbm(x * .15 + 9, z * .15) < .45) continue;
    const s = .7 + hash(i, 3) * .6;
    for (let t = 0; t < 3; t++) { m.compose(new THREE.Vector3(x, h + (.9 + t * .7) * s, z), new THREE.Quaternion(), new THREE.Vector3(s * (1 - t * .22), s, s * (1 - t * .22))); inst.setMatrixAt(k++, m); } }
  inst.count = k; scene.add(inst);
}
{ // rice paddies: flat pale plates with dark bunds, east of the keep
  const mat = new THREE.MeshLambertMaterial({ color: 0xdedad0 }), bund = new THREE.MeshLambertMaterial({ color: 0x555555 });
  for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) { const x = -7.5 + i * 2.1, z = 3 + j * 2.1, y = height(x, z) + .04;
    const p = new THREE.Mesh(new THREE.BoxGeometry(1.9, .06, 1.9), mat); p.position.set(x, y, z); scene.add(p);
    const b = new THREE.Mesh(new THREE.BoxGeometry(2.05, .1, 2.05), bund); b.position.set(x, y - .03, z); scene.add(b); }
}

// ---------- buildings: Tripo models when present, otherwise a blocked-in stand-in ----------
const roofMat = new THREE.MeshLambertMaterial({ color: 0x2a2a2a }), wallMat = new THREE.MeshLambertMaterial({ color: 0xf2efe8 }),
  stoneMat = new THREE.MeshLambertMaterial({ color: 0x8c8a85 }), woodMat = new THREE.MeshLambertMaterial({ color: 0x4a4a4a }), redMat = new THREE.MeshLambertMaterial({ color: 0xC8372D });
const roof = (w, d, h) => { const g = new THREE.ConeGeometry(Math.SQRT1_2 * 1.0, 1, 4); g.rotateY(Math.PI / 4); g.scale(w * 1.25, h, d * 1.25); return new THREE.Mesh(g, roofMat); };
function standIn(type) {
  const g = new THREE.Group();
  if (type === "keep") {
    const base = new THREE.Mesh(new THREE.CylinderGeometry(2.3, 3.1, 1.6, 4, 1), stoneMat); base.rotation.y = Math.PI / 4; base.position.y = .8; g.add(base);
    let y = 1.6, w = 3.0;
    for (let s = 0; s < 4; s++) { const h = s === 0 ? 1.1 : .85, b = new THREE.Mesh(new THREE.BoxGeometry(w, h, w * .85), wallMat); b.position.y = y + h / 2; g.add(b);
      const r = roof(w, w * .85, .7); r.position.y = y + h + .25; g.add(r); y += h + .45; w *= .74; }
    for (const s of [-1, 1]) { const ban = new THREE.Mesh(new THREE.BoxGeometry(.08, 1.1, .45), redMat); ban.position.set(s * 1.9, 2.7, 1.6); g.add(ban); }
  } else if (type === "dojo") {
    const b = new THREE.Mesh(new THREE.BoxGeometry(3.6, 1.1, 2.0), wallMat); b.position.y = .55; g.add(b); const r = roof(3.6, 2, .9); r.position.y = 1.5; g.add(r);
    for (let i = 0; i < 6; i++) { const p = new THREE.Mesh(new THREE.BoxGeometry(.05, 1.4, .05), woodMat); p.position.set(-1.4 + i * .5, .7, 1.4); p.rotation.z = .1; g.add(p); }
  } else { const b = new THREE.Mesh(new THREE.BoxGeometry(1.5, .8, 1.3), wallMat); b.position.y = .4; g.add(b); const r = roof(1.5, 1.3, 1.3); r.position.y = 1.4; g.add(r); }
  return g;
}
const SITES = [["keep", -3.2, -3.2, 0], ["dojo", 4.8, 4.8, 0], ["house", 3.6, -2.6, -.4], ["house", 6.4, .8, .9], ["house", -2.6, 3.8, .2]];
const loader = new GLTFLoader();
for (const [type, x, z, rot] of SITES) {
  const site = new THREE.Group(); site.position.set(x, height(x, z), z); site.rotation.y = rot; scene.add(site);
  const placeholder = standIn(type); site.add(placeholder);
  loader.load(`models/${type}.glb`, gl => {   // fit the Tripo model to the stand-in's footprint, sit it on the ground
    const m = gl.scene, box = new THREE.Box3().setFromObject(m), size = box.getSize(new THREE.Vector3());
    const target = type === "keep" ? 6.4 : type === "dojo" ? 4.4 : 2.8, s = target / Math.max(size.x, size.z);
    m.scale.setScalar(s); m.position.set(-(box.min.x + size.x / 2) * s, -box.min.y * s, -(box.min.z + size.z / 2) * s);
    m.traverse(o => { if (o.isMesh) { const map = o.material.map, vc = !!o.geometry.attributes.color;
      o.material = new THREE.MeshLambertMaterial({ map, vertexColors: vc, color: map || vc ? 0xffffff : 0xdddddd, side: THREE.DoubleSide }); } });
    site.remove(placeholder); site.add(m);
  }, undefined, () => {});
}

// ---------- units: soldiers built from basic shapes, one flat value per part (?units=2d shows the old cutouts) ----------
const UNITS2D = /units=2d/.test(location.search), FACE_CAM = Math.PI / 4;
const unitScene = new THREE.Scene(), tl = new THREE.TextureLoader();
const UNITS = { spr: ["mj_spr4", .471], arc: ["mj_arcF", .461], sam: ["mj_samF", .429], mnk: ["mj_mnk9", .665], nin: ["mj_ninF", .557], tep: ["mj_tepF", .411] };
const units = [], POOL_GEO = new THREE.CircleGeometry(.42, 20), POOL_MAT = new THREE.MeshBasicMaterial({ color: 0x8a8782 });
POOL_GEO.scale(1, .62, 1);
const M = {}; const mat = hex => M[hex] || (M[hex] = new THREE.MeshLambertMaterial({ color: hex, flatShading: true }));
const C = { ink: 0x1d1d21, plate: 0x5a5a5a, paper: 0xefe9dd, wood: 0x3b3b3b, robe: 0x6e6e6e, verm: 0xC8372D };
function mesh(geo, hex, x, y, z, parent, rx = 0, ry = 0, rz = 0) { const m = new THREE.Mesh(geo, mat(hex)); m.position.set(x, y, z); m.rotation.set(rx, ry, rz); parent.add(m); return m; }
const B = (w, h, d) => new THREE.BoxGeometry(w, h, d), CY = (rt, rb, h, n = 6, open = false) => new THREE.CylinderGeometry(rt, rb, h, n, 1, open), CO = (r, h, n = 8) => new THREE.ConeGeometry(r, h, n);
function limb(parent, x, y, len, w, hex, end) {          // a limb that swings from its top joint
  const g = new THREE.Group(); g.position.set(x, y, 0); parent.add(g);
  mesh(B(w, len, w * 1.1), hex, 0, -len / 2, 0, g); if (end) mesh(B(w * .9, w * .8, w * .9), end, 0, -len - w * .3, 0, g); return g;
}
function soldier(kind) {
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const wide = kind === "sam" ? 1.15 : kind === "nin" ? .9 : 1, hip = kind === "nin" ? .55 : .62;
  const legHex = kind === "nin" ? C.robe : C.paper;               // white leggings are the light shape at the feet
  const legs = kind === "mnk" ? [] : [limb(body, -.1, hip, hip, .15, legHex, C.ink), limb(body, .1, hip, hip, .15, legHex, C.ink)];
  const torsoHex = kind === "nin" ? C.robe : C.ink, top = hip + .78;
  if (kind === "mnk") mesh(CY(.24, .44, 1.0, 7), C.ink, 0, .5, 0, body);                 // long dark robe to the ground
  else mesh(CY(.24 * wide, .36 * wide, .36, 6), kind === "nin" ? C.robe : C.plate, 0, hip + .14, 0, body);   // armour skirt
  mesh(B(.5 * wide, .46, .32), torsoHex, 0, hip + .55, 0, body);
  if (kind !== "nin" && kind !== "mnk") for (const sx of [-1, 1]) mesh(B(.17, .24, .32 * wide), C.plate, sx * .33 * wide, top - .14, 0, body, 0, 0, sx * .18);   // shoulder plates
  const armHex = kind === "nin" ? C.robe : C.ink;
  const armR = limb(body, -.31 * wide, top - .06, .5, .12, armHex, C.paper), armL = limb(body, .31 * wide, top - .06, .5, .12, armHex, C.paper);
  const head = new THREE.Group(); head.position.y = top; body.add(head);
  mesh(B(.22, .25, .22), C.paper, 0, .125, 0, head);                                      // face: the light shape at the top
  if (kind === "spr") { mesh(CO(.44, .22, 10), C.ink, 0, .34, 0, head); }                 // jingasa: wide conical hat
  if (kind === "arc") { mesh(B(.24, .1, .24), C.ink, 0, .27, 0, head); mesh(B(.25, .05, .25), C.paper, 0, .2, 0, head); mesh(B(.04, .05, .16), C.paper, 0, .2, -.18, head, .6); }
  if (kind === "sam") {
    mesh(new THREE.SphereGeometry(.17, 8, 4, 0, Math.PI * 2, 0, Math.PI / 2), C.ink, 0, .23, 0, head);
    mesh(CY(.18, .34, .16, 8, true), C.ink, 0, .17, -.02, head);                          // flared neck guard
    mesh(new THREE.TorusGeometry(.2, .035, 4, 12, Math.PI), C.paper, 0, .38, .14, head, 0, 0, 0);   // crescent crest
  }
  if (kind === "mnk") { mesh(B(.32, .34, .32), C.paper, 0, .15, -.02, head); mesh(B(.2, .05, .02), C.ink, 0, .17, .15, head); }   // white cowl, eye slit
  if (kind === "nin") { mesh(B(.27, .3, .27), C.ink, 0, .14, -.01, head); mesh(B(.18, .06, .02), C.paper, 0, .15, .13, head); }    // dark hood, eye slit
  if (kind !== "nin" && kind !== "mnk") {                                                 // sashimono: the Tsuru vermilion on every clan soldier
    mesh(CY(.016, .016, 1.3, 4), C.wood, 0, top + .35, -.2, body);
    mesh(B(.02, .3, .18), C.verm, 0, top + .8, -.2 - .09, body, 0, Math.PI / 2, 0);
  }
  if (kind === "spr") { const sp = mesh(CY(.022, .022, 2.9, 4), C.wood, 0, -.15, .05, armR, .08); mesh(CO(.05, .26, 4), C.paper, 0, 1.55, 0, sp); }
  if (kind === "arc") { mesh(new THREE.TorusGeometry(.78, .028, 4, 14, Math.PI * .85), C.ink, .02, -.45, .08, armL, 0, Math.PI / 2, Math.PI / 2 + Math.PI * .075);
    const q = mesh(CY(.07, .07, .55, 6), C.plate, .12, top - .05, -.2, body, -.35); for (const dx of [-.03, .03]) mesh(B(.02, .2, .02), C.paper, dx, .32, 0, q); }
  if (kind === "sam") { mesh(B(.04, .04, .9), C.ink, .24, hip + .3, .12, body, .5, .3); }   // sword at the hip
  if (kind === "mnk") { const n = mesh(CY(.022, .022, 2.4, 4), C.wood, 0, -.2, .05, armR, .12); mesh(B(.05, .5, .1), C.paper, 0, 1.38, .06, n, .3); }   // naginata
  if (kind === "nin") { mesh(B(.04, .7, .05), C.ink, .1, top + .05, -.2, body, 0, 0, .7); body.rotation.x = .18; }   // short sword on the back, a forward crouch
  root.userData = { body, legs, armR, armL, weaponArm: ["spr", "mnk"].includes(kind) ? armR : kind === "arc" ? armL : null };
  root.scale.setScalar(.95); return root;
}
function addUnit(kind, x, z, scout) {
  const u = { x, z, tx: x, tz: z, wait: Math.random() * 3, scout, home: [x, z], phase: Math.random() * 6, yaw: Math.PI / 4 + (Math.random() - .5) * 1.2, moving: false };
  if (UNITS2D) {
    const [id, piv] = UNITS[kind], tex = tl.load(`assets/${id}.webp`, t => { const h = 1.95, w = h * t.image.width / t.image.height; sp.scale.set(w, h, 1); sp.userData.w = w; });
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, alphaTest: .5 })); sp.center.set(piv, 0); unitScene.add(sp); u.sp = sp;
  } else { u.fig = soldier(kind === "tep" ? "spr" : kind); scene.add(u.fig); }
  u.pool = new THREE.Mesh(POOL_GEO, POOL_MAT); u.pool.rotation.x = -Math.PI / 2; scene.add(u.pool);
  units.push(u); poseUnit(u, 0); return u;
}
function poseUnit(u, st) {                                 // called on twos: 12 poses a second
  const y = height(u.x, u.z);
  if (u.sp) { u.sp.position.set(u.x, y + (u.moving && Math.floor(u.phase) % 2 ? .04 : 0), u.z); }
  if (u.fig) {
    const d = u.fig.userData, s = u.moving ? Math.sin(u.phase) : 0, idle = Math.sin(u.phase * .35) * .05;

    d.armR.rotation.x = (d.armR === d.weaponArm ? -s * .12 : -s * .45) + idle; d.armL.rotation.x = (d.armL === d.weaponArm ? s * .12 : s * .45) - idle;

    let dy = u.yaw - u.fig.rotation.y; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); u.fig.rotation.y += dy * .5;

[["spr", -.3, .6], ["spr", 2.7, .2], ["arc", .2, 2.6], ["sam", 2.6, 2.6], ["mnk", -1.0, 3.0], ["spr", 3.4, -1.2], ["arc", 1.2, -.6], ["spr", 1.4, 1.5]].forEach(a => addUnit(...a));
const scout = addUnit("nin", -1, 4.5, true);
const actors = [];                                          // (the Tripo spearman stays available: ?tripo=1)
function addActor(file, path, height) {
  loader.load(`models/${file}`, gl => {
    const root = gl.scene, box = new THREE.Box3().setFromObject(root), s = height / (box.max.y - box.min.y); root.scale.setScalar(s);
    root.traverse(o => { if (o.isMesh) { o.material = new THREE.MeshLambertMaterial({ map: o.material.map, side: THREE.DoubleSide }); o.frustumCulled = false; } });
    const holder = new THREE.Group(); holder.add(root); scene.add(holder);
    const mixer = new THREE.AnimationMixer(root), walk = gl.animations[0]; if (walk) mixer.clipAction(walk).play();

if (/tripo=1/.test(location.search)) addActor("spearman.glb", [[1.4, 3.0], [3.2, 1.4], [1.4, -.2], [-.4, 1.4]], 2.1);
function stepActors(st) {

// ---------- camera: orthographic isometric, portrait ----------
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, -200, 400), target = new THREE.Vector3(.6, 0, .6);
let zoom = 1.3;
const AZ = Math.PI / 4, EL = THREE.MathUtils.degToRad(33);
function placeCam() { const vh = 26 / zoom, a = innerWidth / innerHeight; cam.top = vh / 2; cam.bottom = -vh / 2; cam.left = -vh * a / 2; cam.right = vh * a / 2; cam.updateProjectionMatrix();

const tg = target2d.getContext("2d"), sg = shown2d.getContext("2d");

const revealTex = new THREE.CanvasTexture(shown2d); revealTex.minFilter = revealTex.magFilter = THREE.LinearFilter;

// ---------- composite: ink the real world, paint the unknown, let the wet edge bleed ----------

const post = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1); post.add(quad); quad.frustumCulled = false;

function resize() { renderer.setSize(innerWidth, innerHeight); const w = innerWidth * DPR, h = innerHeight * DPR;
  for (const t of [colorRT, normalRT, unitRT]) t.setSize(w, h); quad.material.uniforms.res.value.set(w, h); placeCam(); }
addEventListener("resize", resize); resize();

// ---------- input: drag to pan, pinch to zoom, tap to send the scout ----------
const ptrs = new Map(); let downAt = null, moved = 0, pinch0 = 0, zoom0 = 1;
const ray = new THREE.Raycaster(), groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
renderer.domElement.addEventListener("pointerdown", e => { ptrs.set(e.pointerId, [e.clientX, e.clientY]); downAt = [e.clientX, e.clientY]; moved = 0;
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); zoom0 = zoom; } });
renderer.domElement.addEventListener("pointermove", e => { if (!ptrs.has(e.pointerId)) return; const p = ptrs.get(e.pointerId), dx = e.clientX - p[0], dy = e.clientY - p[1]; ptrs.set(e.pointerId, [e.clientX, e.clientY]);

  moved += Math.abs(dx) + Math.abs(dy); const s = (cam.top - cam.bottom) / innerHeight;
  const right = new THREE.Vector3(Math.cos(AZ), 0, -Math.sin(AZ)), fwd = new THREE.Vector3(-Math.sin(AZ), 0, -Math.cos(AZ));
  target.addScaledVector(right, -dx * s).addScaledVector(fwd, dy * s / Math.sin(EL) * .5); target.x = THREE.MathUtils.clamp(target.x, -HALF, HALF); target.z = THREE.MathUtils.clamp(target.z, -HALF, HALF); placeCam(); });

  ray.setFromCamera(ndc, cam); const hit = new THREE.Vector3(); for (let i = 0; i < 4; i++) { groundPlane.constant = -(i ? height(hit.x, hit.z) : 0); ray.ray.intersectPlane(groundPlane, hit); }
  scout.tx = THREE.MathUtils.clamp(hit.x, -HALF + 1, HALF - 1); scout.tz = THREE.MathUtils.clamp(hit.z, -HALF + 1, HALF - 1); scout.wait = 0; } downAt = null; };
renderer.domElement.addEventListener("pointerup", up); renderer.domElement.addEventListener("pointercancel", up);
addEventListener("wheel", e => { zoom = THREE.MathUtils.clamp(zoom * (e.deltaY < 0 ? 1.1 : .91), .55, 2.2); placeCam(); });

let night = 0, nightTo = 0;
const btn = id => document.getElementById(id);
btn("bNight").onclick = e => { nightTo = 1 - nightTo; e.target.classList.toggle("on", !!nightTo); };
btn("bFog").onclick = e => { const u = quad.material.uniforms.fogOn; u.value = 1 - u.value; e.target.classList.toggle("on", !!u.value); };
btn("bInk").onclick = e => { const u = quad.material.uniforms.inkOn; u.value = 1 - u.value; e.target.classList.toggle("on", !!u.value); };
btn("bReset").onclick = () => resetFog();

// ---------- loop: units walk on twos (12 steps a second), the fog soaks toward what has been seen ----------

const tmp = new THREE.Vector3(), camRight = new THREE.Vector3(Math.cos(AZ), 0, -Math.sin(AZ));
function frame(now) {

requestAnimationFrame(frame);
window.__p3 = { actors, scene, units, scout, target, placeCam, setZoom: z => { zoom = z; placeCam(); }, setNight: v => { nightTo = night = v; }, resetFog };
