<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Sengoku live 3D test</title>
<style>html,body{margin:0;height:100%;background:#d9c9a3;overflow:hidden;touch-action:none;font:13px/1.3 system-ui,sans-serif}
canvas{display:block}#hud{position:fixed;left:8px;top:8px;background:#1b1b1fcc;color:#f2ead8;padding:6px 9px;border-radius:6px;white-space:pre}</style>
<script type="importmap">{"imports":{"three":"../vendor/three.module.js","three/addons/":"../vendor/jsm/"}}</script>
</head><body><div id="hud">loading…</div>
<script type="module">
// Feasibility test: decimated sculpts rendered live at the game's fixed camera (45° azimuth, 35.3° elevation, orthographic),
// toon shading in 3 bands + inverted-hull ink outline. Drag to pan, pinch / wheel to zoom.
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
const hud = document.getElementById("hud");
const r = new THREE.WebGLRenderer({ antialias: true }); r.setPixelRatio(Math.min(devicePixelRatio, 2));
r.setSize(innerWidth, innerHeight); r.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xd9c9a3);
const grad = new THREE.DataTexture(new Uint8Array([90, 170, 255]), 3, 1, THREE.RedFormat); grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(-3, 5, 4); scene.add(sun);
const INK = new THREE.MeshBasicMaterial({ color: 0x1b1b1f, side: THREE.BackSide });
const toon = (m) => new THREE.MeshToonMaterial({ map: m?.map || null, color: m?.map ? 0xffffff : (m?.color || new THREE.Color(0xcccccc)), gradientMap: grad });

// camera: orthographic, fixed angle
const AZ = Math.PI / 4, EL = Math.asin(37 / 64); let zoom = 9, tx = 0, tz = 0;
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, -100, 200);
function placeCam() { const a = innerWidth / innerHeight; cam.left = -zoom * a; cam.right = zoom * a; cam.top = zoom; cam.bottom = -zoom; cam.updateProjectionMatrix();
  cam.position.set(tx + Math.sin(AZ) * Math.cos(EL) * 50, Math.sin(EL) * 50, tz + Math.cos(AZ) * Math.cos(EL) * 50); cam.lookAt(tx, 0, tz); }
placeCam(); addEventListener("resize", () => { r.setSize(innerWidth, innerHeight); placeCam(); });

// board: 16x16 tiles, chunky sculpted blocks in the period palette, a river and a road
const N = 16, tiles = new THREE.Group(); scene.add(tiles);
const tileGeo = new THREE.BoxGeometry(0.98, 0.3, 0.98);
const pal = { g1: 0x6f8a5e, g2: 0x4c6344, g3: 0x7f9868, dirt: 0xc7ad70, water: 0x4a6788 };
const tileMats = Object.fromEntries(Object.entries(pal).map(([k, c]) => [k, new THREE.MeshToonMaterial({ color: c, gradientMap: grad })]));
const river = (x) => Math.round(4 + Math.sin(x * .5) * 1.5) + 7;
let tileCount = 0;
for (let x = 0; x < N; x++) for (let z = 0; z < N; z++) {
  const isRiver = z === river(x) && x > 9, isRoad = (x === 7 || z === 7) && !isRiver;
  const k = isRiver ? "water" : isRoad ? "dirt" : ["g1", "g1", "g3", "g2"][(x * 7 + z * 13) % 4];
  const m = new THREE.Mesh(tileGeo, tileMats[k]); m.position.set(x - N / 2 + .5, isRiver ? -.22 : -.15 + ((x * 31 + z * 17) % 5) * .008, z - N / 2 + .5);
  tiles.add(m); tileCount++;
}

// models
const loader = new GLTFLoader(); const cache = {};
async function load(name) { if (!cache[name]) cache[name] = loader.loadAsync(`${name}.glb`); return (await cache[name]).scene; }
let tris = 0;
async function put(name, x, z, size, rot = 0, outline = 0.025) {
  const src = await load(name); const root = src.clone(true);
  root.traverse(o => { if (o.isMesh) { o.material = toon(o.material); tris += o.geometry.index ? o.geometry.index.count / 3 : o.geometry.attributes.position.count / 3; } });
  // normalise: footprint (buildings) or height (units) to "size" tiles, sitting on the board
  const box = new THREE.Box3().setFromObject(root), c = box.getCenter(new THREE.Vector3());
  const fp = Math.max(box.max.x - box.min.x, box.max.z - box.min.z), h = box.max.y - box.min.y;
  const s = size.h ? size.h / h : size.fp / fp;
  root.position.set(-c.x, -box.min.y, -c.z);
  const g = new THREE.Group(); g.add(root); g.scale.setScalar(s); g.rotation.y = rot; g.position.set(x, 0, z);
  // ink outline: inverted hull, slightly inflated
  const hull = root.clone(true); hull.traverse(o => { if (o.isMesh) { o.material = INK; } }); hull.scale.setScalar(1 + outline / (size.h || size.fp) * 3);
  hull.position.copy(root.position).multiplyScalar(hull.scale.x); g.add(hull);
  scene.add(g); return g;
}
const B = [["keep", 0, 0, { fp: 2.8 }, Math.PI / 2], ["house", -3, -3, { fp: 1.8 }, Math.PI / 2], ["house", -3, 3, { fp: 1.8 }, Math.PI / 2], ["house", 3, -3.2, { fp: 1.8 }, Math.PI / 2],
  ["temple", 3.5, 3, { fp: 2.2 }, Math.PI / 2], ["smith", -5.5, 0, { fp: 1.9 }, Math.PI / 2], ["kura", 0, -5, { fp: 1.9 }, Math.PI / 2]];
const T = [[-6, -6], [-6.5, 5], [6, -6], [5.5, -4.8], [-2, 6.5], [6.2, 6.2], [-7, -1.5]];
const units = [];
(async () => {
  try {
    await Promise.all(B.map(b => put(...b)));
    await Promise.all(T.map(([x, z], i) => put(i % 3 ? "pine" : "rocks", x, z, i % 3 ? { h: 2.2 } : { fp: 1.1 }, i)));
    const kinds = ["spear", "sam", "arc", "spear", "spear", "wk", "wk", "oni", "kap", "gh"];
    for (let i = 0; i < kinds.length; i++) {
      const k = kinds[i], enemy = ["oni", "kap", "gh"].includes(k);
      const u = await put(k, 0, 0, { h: k === "oni" ? 1.25 : k === "kap" ? .75 : .95 }, 0, .02);
      units.push({ g: u, a: i / kinds.length * Math.PI * 2, rad: enemy ? 6.3 : 4.6, sp: enemy ? -.12 : .16, enemy, float: k === "gh" });
    }
  } catch (e) { hud.textContent = "load error: " + e.message; throw e; }
})();

// pan / zoom
let drag = null, pinch = null;
r.domElement.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY }; r.domElement.setPointerCapture(e.pointerId); });
r.domElement.addEventListener("pointermove", e => { if (!drag || pinch) return; const k = zoom * 2 / innerHeight, dx = (e.clientX - drag.x) * k, dy = (e.clientY - drag.y) * k / Math.sin(EL);
  tx -= (dx * Math.cos(AZ) - dy * Math.sin(AZ)) * .7; tz -= (-dx * Math.sin(AZ) - dy * Math.cos(AZ)) * .7; drag = { x: e.clientX, y: e.clientY }; placeCam(); });
addEventListener("pointerup", () => drag = null);
r.domElement.addEventListener("wheel", e => { zoom = Math.min(14, Math.max(3, zoom * (1 + e.deltaY * .001))); placeCam(); }, { passive: true });
r.domElement.addEventListener("touchmove", e => { if (e.touches.length === 2) { const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  if (pinch) { zoom = Math.min(14, Math.max(3, zoom * pinch / d)); placeCam(); } pinch = d; } }, { passive: true });
r.domElement.addEventListener("touchend", () => pinch = null);

// loop: units walk circles and face where they go; fps meter
let last = performance.now(), frames = 0, acc = 0, fps = 0;
r.setAnimationLoop(t => {
  const dt = Math.min(.05, (t - last) / 1000); last = t; frames++; acc += dt;
  if (acc > .5) { fps = Math.round(frames / acc); frames = 0; acc = 0;
    hud.textContent = `${fps} fps · ${Math.round(tris / 1000)}k tris (+outlines) · ${tileCount} tiles\n${r.info.render.calls} draw calls · ${innerWidth}×${innerHeight} @${r.getPixelRatio()}x`; }
  for (const u of units) {
    u.a += u.sp * dt; const x = Math.cos(u.a) * u.rad, z = Math.sin(u.a) * u.rad;
    const dx = x - u.g.position.x, dz = z - u.g.position.z;
    if (dx * dx + dz * dz > 1e-8) u.g.rotation.y = Math.atan2(dx, dz);
    u.g.position.set(x, (u.float ? .25 + Math.sin(t * .003) * .08 : Math.abs(Math.sin(t * .012 + u.a * 9)) * .05), z);
  }
  r.render(scene, cam);
});
</script></body></html>
